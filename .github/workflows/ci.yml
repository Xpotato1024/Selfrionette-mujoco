name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Validate changed Markdown
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          uv run python scripts/repository/validate_markdown_docs.py --base-ref "$BASE_SHA" --strict-map --strict-links
      - name: Architecture A
        shell: bash
        run: |
          mapfile -t files < <(find tests/architecture -maxdepth 1 -name 'test_a*.py' -print | sort)
          ((${#files[@]} == 0)) || uv run pytest "${files[@]}" -q
      - name: Architecture B
        shell: bash
        run: |
          mapfile -t files < <(find tests/architecture -maxdepth 1 -name 'test_b*.py' -print | sort)
          ((${#files[@]} == 0)) || uv run pytest "${files[@]}" -q
      - name: Architecture C
        shell: bash
        run: |
          mapfile -t files < <(find tests/architecture -maxdepth 1 -name 'test_c*.py' -print | sort)
          ((${#files[@]} == 0)) || uv run pytest "${files[@]}" -q
      - name: Architecture D
        shell: bash
        run: |
          mapfile -t files < <(find tests/architecture -maxdepth 1 -name 'test_d*.py' -print | sort)
          ((${#files[@]} == 0)) || uv run pytest "${files[@]}" -q
      - name: Architecture E
        shell: bash
        run: |
          mapfile -t files < <(find tests/architecture -maxdepth 1 -name 'test_e*.py' -print | sort)
          ((${#files[@]} == 0)) || uv run pytest "${files[@]}" -q
      - name: Architecture F
        shell: bash
        run: |
          mapfile -t files < <(find tests/architecture -maxdepth 1 -name 'test_f*.py' -print | sort)
          ((${#files[@]} == 0)) || uv run pytest "${files[@]}" -q
      - name: Architecture G-Z
        shell: bash
        run: |
          mapfile -t files < <(find tests/architecture -maxdepth 1 -name 'test_[g-z]*.py' -print | sort)
          ((${#files[@]} == 0)) || uv run pytest "${files[@]}" -q
      - name: Compile Python files
        run: uv run python -m compileall src tests
      - name: Check diff whitespace
        run: git diff --check

  viewer-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mujoco-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mujoco-viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci
      - name: Test viewer
        run: npm test
      - name: Typecheck viewer
        run: npm run typecheck
      - name: Build viewer
        run: npm run build
