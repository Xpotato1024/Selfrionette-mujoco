name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Validate changed Markdown
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          uv run python scripts/repository/validate_markdown_docs.py --base-ref "$BASE_SHA" --strict-map --strict-links
      - name: Run tests
        run: uv run pytest tests/architecture tests/schemas tests/support tests/runtime tests/mujoco_backend tests/transport tests/motion tests/kinematics tests/plugins tests/integration tests/selfrionette -q
      - name: Compile Python files
        run: uv run python -m compileall src tests
      - name: Check diff whitespace
        run: git diff --check

  viewer-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mujoco-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mujoco-viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci
      - name: Test viewer
        run: npm test
      - name: Typecheck viewer
        run: npm run typecheck
      - name: Build viewer
        run: npm run build
