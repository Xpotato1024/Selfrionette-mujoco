[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfrionette-mujoco"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.0",
    "mujoco>=3.9.0",
    "websockets>=16.0",
]

[project.scripts]
selfrionette = "selfrionette.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
